    Research Experience:
      - company: "DOLENet — Detection-Oriented Low-Light Enhancement"
        position: First author · journal manuscript in preparation
        start_date: 2026
        end_date: present
        summary: >
          Low-light enhancement is normally optimised for human perception and then attached to a
          detector that had no say in the objective. This work studies enhancement whose only consumer
          is the detector.
        highlights:
          - Multi-seed YOLOv8 / ExDark experiments, gradient-conflict analysis and routing audits.
          - TP/FP/FN error analysis separating genuine detection gains from cosmetic ones.
          - "Prof. Minpo Jung serves as advisor and corresponding author."

      - company: "Master's Thesis — A Study on Deep Learning-Based Low-Light Image Enhancement"
        position: Author
        start_date: 2025
        end_date: 2026
        summary: >
          Zero-reference learning, local illumination balancing, shadow recovery and efficient image
          restoration without increasing inference cost.
        highlights:
          - Two exposure-aware losses of my own design on the Zero-DCE framework.
          - Benchmarked against Retinexformer and RUAS.
          - Evaluated on NIQE, BRISQUE, LOE, PSNR, SSIM and LPIPS.

