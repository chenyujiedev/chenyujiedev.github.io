    Research:
      - company: DOLENet — Detection-Oriented Low-Light Enhancement
        position: First author · manuscript in preparation
        start_date: 2026
        end_date: present
        summary: >
          Studies low-light enhancement whose only consumer is a detector, rather than enhancement
          optimised for human perception and attached to a detector afterwards.
        highlights:
          - Multi-seed YOLOv8 / ExDark experiments, gradient-conflict analysis and routing diagnostics.
          - TP/FP/FN error decomposition to separate genuine detection gains from cosmetic ones.
          - "Prof. Minpo Jung serves as advisor and corresponding author."

      - company: MSc Thesis — Deep-Learning Low-Light Image Enhancement
        position: Author
        start_date: 2025
        end_date: 2026
        summary: >
          Zero-reference training, local illumination balancing and shadow recovery without adding
          inference cost.
        highlights:
          - Two exposure-aware losses of my own design on the Zero-DCE framework.
          - Benchmarked against Retinexformer and RUAS.
          - Evaluated on NIQE, BRISQUE, LOE, PSNR, SSIM and LPIPS.

